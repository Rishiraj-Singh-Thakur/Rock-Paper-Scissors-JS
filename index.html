<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triple-Throw-(RPS)</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="nameofgame">
       <h1>Rock Paper Scissors</h1>
    </div>
    <div id="note">
        <div>Choice one :- what you want ??</div>
    </div>
    <div class="choice">
       <div>
         <div id="rock"></div>
         <div id="rock-name">ROCK</div>
        </div>
        <div>
        <div id="paper"></div>
        <div id="paper-name">PAPER</div>
        </div>
        <div>
        <div id="scissor"></div>
        <div id="scissor-name">SCISSOR</div>
        </div>
    </div>
    <div class="counter">
        <div>
        <div id="user"></div>
        <p class="scorrer-name">Your Score</p>

        </div>
        <div>
        <div id="computer"></div>
         <p class="scorrer-name">Comptr Score</p>
        </div>
    </div>
    <div class="massage">
        <p id="msg"></p>
    </div>
    <button id="reset">Reset Game </button>
    <script src="index.js"></script>
</body>
</html>
